[project]
name = "enterprise-knowledge-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sukanya V S", email = "sukanyas@xminds.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
